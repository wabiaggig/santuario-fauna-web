spring.application.name=santuario-fauna-web
spring.config.import=optional:file:./application-local.properties

spring.jpa.hibernate.ddl-auto=validate
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SANTUARIO_DB_URL:jdbc:mysql://localhost:3307/db_santuario?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SANTUARIO_DB_USER:root}
spring.datasource.password=${SANTUARIO_DB_PASSWORD:}

spring.web.locale=es_PE
spring.web.locale-resolver=fixed
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
