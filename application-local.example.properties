# Copiar como application-local.properties y completar solo en tu equipo.
# Revisar el puerto de MySQL; este archivo de ejemplo no contiene claves.
spring.datasource.url=jdbc:mysql://localhost:3306/db_santuario?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Opcional: habilitar los usuarios originales mediante el perfil demo.
# Si ya se ejecuto sql/actualizar_usuarios_login.sql, estas dos propiedades
# no son necesarias. La clave elegida debe tener
# al menos 12 caracteres (y como maximo 72 bytes en UTF-8).
spring.profiles.active=demo
santuario.demo.clave=
# Las cuentas ya habilitadas no cambian su clave al reiniciar.
